<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>typing test</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="test" id="test-screen">
    <section class="stats">
      <div class="stat">
        <span class="label">wpm</span>
        <span class="value" id="wpm">0</span>
      </div>
      <div class="stat">
        <span class="label">acc</span>
        <span class="value" id="accuracy">100%</span>
      </div>
    </section>

    <div class="passage" id="passage"></div>
    <textarea id="input" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" tabindex="-1" aria-label="Typing input"></textarea>

    <div class="controls">
      <button type="button" id="restart">restart</button>
    </div>
  </main>

  <main class="test finished" id="result-screen" hidden>
    <section class="stats">
      <div class="stat">
        <span class="label">wpm</span>
        <span class="value" id="result-wpm">0</span>
      </div>
      <div class="stat">
        <span class="label">acc</span>
        <span class="value" id="result-accuracy">100%</span>
      </div>
    </section>

    <div class="controls">
      <button type="button" id="again">try again</button>
    </div>
  </main>
</body>
</html>
